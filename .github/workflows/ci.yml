name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # also builds fast-esbuild-wasm's generated files (root "prepare" script)
      - run: npm ci
      - run: npm test
      # pack every package, install the tarballs under the original names,
      # check them from Node and bundle them for the browser
      - run: node verify/pack-smoke.mjs
