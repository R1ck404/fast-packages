[package]
name = "fastbrotli"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
brotli = { path = "vendor/brotli", features = ["fast-fixed-params"] }
brotli-decompressor = { path = "vendor/brotli-decompressor" }
alloc-no-stdlib = { path = "vendor/alloc-no-stdlib" }
alloc-stdlib = { path = "vendor/alloc-stdlib" }
# compress() options parsing (cold code: optimized for size)
fastbrotli-options = { path = "options" }

[features]
# the fast one-shot decoder (src/dec_api.rs, src/fastdec)
default = ["fastdec"]
fastdec = []
# benchmark-only exports (bench_*)
bench = ["brotli/fast-bench"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.release.package.fastbrotli-options]
opt-level = "z"
